<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pasatiempos - La Sala de los Enigmas</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Encabezado -->
    <header class="cabecera">
        <h1>La Sala de los Enigmas</h1>
    </header>

           <!-- Menu -->
   <nav class="navbar navbar-expand-lg navbar-dark menu-principal">
    <div class="container">
        <a class="navbar-brand" href="index.html">Inicio</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNavegacion">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="operaciones.html">Operaciones</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="adivinanzas.html">Pasatiempos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="retos.html">Retos matemáticos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="acerca.html">Acerca de</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
    <!-- Fin menu -->
    <!-- Pagina de pasatiempos -->
    <div class="container mt-5">

        <h2 class="text-center">Zona de pasatiempos</h2>

        <p class="text-center">
            Pon a prueba tu ingenio con nuestros pasatiempos.
            ¿Serás capaz de resolverlos?
        </p>
        <!-- Adivinanza -->
        <h4>¿Adivinas qué soy?</h4>
        <p id="pregunta" class="fs-5 mt-4"></p>
        
        <!-- Respuesta del jugador -->
        <input type="text" id="respuesta" class="form-control mt-3" placeholder="Escribe tu respuesta">
        
        <!-- Comprobar respuesta -->
        <button id="botonComprobar" class="btn btn-primary mt-3" onclick="comprobarAdivinanza()">
            Comprobar
        </button>

        <!-- Resultado -->
        <p id="resultadoAdivinanza" class="mt-3"></p>

        <!-- Puntuacion -->
        <p>Aciertos: <span id="aciertos">0</span></p>

        <!-- Siguiente adivinanza -->
        <button id="botonSiguiente" class="btn btn-secondary" onclick="siguienteAdivinanza()">
            Siguiente adivinanza
        </button>

    </div>
<script src="js/adivinanzas.js"></script>
</body>
</html>
