    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!--Estilo CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecera text-center p-4">
    <h1>La Sala de los Enigmas</h1>
    <p>Retos matemáticos</p>
</header>
       <!-- Menu -->
   <nav class="navbar navbar-expand-lg navbar-dark menu-principal">
    <div class="container">
        <a class="navbar-brand" href="index.html">Inicio</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNavegacion">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="operaciones.html">Operaciones</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="adivinanzas.html">Pasatiempos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="retos.html">Retos matemáticos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="acerca.html">Acerca de</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
    <!-- Fin menu -->

<div class="card mx-auto mt-4" style="max-width: 600px;">
    <div class="card-body">
        <h4>Desafío matemático</h4>
        <p id="preguntaReto" class="fs-4 mt-4"></p>
        <input type="number" id="respuestaReto"
               class="form-control mt-3"
               placeholder="Escribe tu respuesta">
        <button id="botonComprobar"
                class="btn btn-primary mt-3"
                onclick="comprobarReto()">
            Comprobar
        </button>
        <p id="resultadoReto" class="mt-3"></p>
        <p>Aciertos: <span id="aciertosReto">0</span></p>
        <button id="botonSiguiente"
                class="btn btn-success mt-2"
                onclick="siguienteReto()"
                style="display:none;">
            Siguiente reto
        </button>
        <button id="botonReiniciar"
                class="btn btn-primary mt-2"
                onclick="reiniciarRetos()"
                style="display:none;">
            Volver a jugar
        </button>
    </div>
</div>
<script src="js/retos.js"></script>
</body>
